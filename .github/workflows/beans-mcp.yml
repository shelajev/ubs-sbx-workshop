name: Beans MCP
on:
  push:
    branches: [main, 'adopt/**', 'fix/**']
    tags: ['beans-mcp-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/beans/go.mod
          cache-dependency-path: mcp/beans/go.sum
      - name: Check sample-app preparation
        run: |
          bash scripts/tests/app-materials-mode.sh
          bash scripts/tests/prepare-node-modules.sh
          bash scripts/tests/install-guidance.sh
          ./scripts/get-materials.sh --app-only
          bash scripts/tests/app-cli-paths.sh
      - name: Check sandbox message delivery
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -B scripts/tests/crew.py
          bash scripts/tests/crew-notify.sh
      - name: Install real Beans and build the native adapter
        run: |
          ./scripts/install-beans.sh
          ./scripts/build-mcp.sh
          ./scripts/backlog-init.sh --disposable
          bash scripts/tests/platform.sh
      - name: Check Go formatting and vet
        working-directory: mcp/beans
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Run native protocol suite
        env:
          WORKSHOP_REQUIRE_PROTOCOL_TESTS: '1'
        run: |
          ROOT="$PWD"
          . scripts/common.sh
          native_path() { if [ "$(host_os)" = Windows ]; then cygpath -am "$1"; else printf '%s' "$1"; fi; }
          export WORKSHOP_TEST_BEANS_BIN="$(native_path "$(beans_bin)")"
          export WORKSHOP_TEST_ADAPTER_BIN="$(native_path "$BIN_DIR/beans-mcp$(executable_suffix)")"
          export WORKSHOP_TEST_WRAPPER="$(native_path "$ROOT/scripts/beans-mcp")"
          cd mcp/beans
          go test -count=1 -v ./...
  build:
    name: Release binaries
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/beans/go.mod
          cache-dependency-path: mcp/beans/go.sum
      - name: Select adapter version
        id: version
        run: |
          . scripts/versions.env
          echo "value=$BEANS_MCP_VERSION" >> "$GITHUB_OUTPUT"
      - run: ./scripts/build-mcp.sh --release
      - name: Verify checksums
        run: |
          . scripts/versions.env
          cd "dist/beans-mcp/$BEANS_MCP_VERSION"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beans-mcp-release
          path: dist/beans-mcp/${{ steps.version.outputs.value }}/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/beans-mcp-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beans-mcp-release
          path: release
      - name: Publish tested adapter binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/versions.env
          test "$GITHUB_REF_NAME" = "beans-mcp-v$BEANS_MCP_VERSION"
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Beans MCP $BEANS_MCP_VERSION" \
            --notes "Native Go adapter for the workshop's host Beans backlog. Protocol reads, note writes, isolation and the Bash entrypoint are tested with the real Beans CLI on Windows x64, macOS ARM64/x64 and Linux ARM64/x64. Includes SHA-256 checksums and build provenance. This validates the adapter; full Windows SBX chapters still need a host rehearsal." \
            beans-mcp_* SHA256SUMS release-manifest.json LICENSE THIRD-PARTY-NOTICES.md
