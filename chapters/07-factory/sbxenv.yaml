schemaVersion: "1"
name: "${{ env.args.name }}"
agent: claude
workspace: "${{ env.args.app }}"
args:
  app:
    default: ../../sample-app
  name:
    required: true
  host_shell:
    default: bash
sandboxOptions:
  skills: off
  cpus: 4
  memory: 8g
ports:
  - sandbox: 8080
    host: 3102
    protocol: tcp4
    hostIP: 127.0.0.1
kits:
  - source: "git+https://github.com/shelajev/acr-sbx-kit.git#ref=f446b95bccabd879912db174c190ff09377b7c7b"
  - source: ../kits/herdr
mcp:
  servers:
    - name: "${{ env.args.name }}-beans"
      command: "${{ env.args.host_shell }}"
      args: ["${{ env.fileDir }}/../../scripts/beans-mcp", --allow-notes]
